name: Bon Point static checks
on:
  pull_request:
  push:
    branches:
      - main
      - refonte-premium-lancement-2026
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Worker module syntax
        run: node --input-type=module --check < cloudflare-v2/src/index.js
      - name: Check new private services Worker syntax
        run: node --input-type=module --check < cloudflare-v2/src/site-services.js
      - name: Check calendar and administration Worker syntax
        run: node --input-type=module --check < cloudflare-v2/src/operations.js
      - name: Verify private admin readiness audit safety
        run: node --test cloudflare-v2/scripts/test-admin-readiness.mjs
      - name: Test isolated private parent accounts and lesson PDFs
        run: node --test cloudflare-v2/scripts/test-parent-portal.mjs
      - name: Test administrator authentication and second factor
        run: node --test cloudflare-v2/scripts/test-admin.mjs
      - name: Test Brevo transactional delivery safety
        run: node --test cloudflare-v2/scripts/test-mail-smoke.mjs
      - name: Simulate Stripe Checkout payments, signed webhooks and duplicate prevention (no external API)
        run: node --test cloudflare-v2/scripts/test-stripe-checkout-mock.mjs
      - name: Check atomic booking slot migrations
        run: python3 scripts/test-booking-db.py
      - name: Test Brevo booking email queue and retry behavior
        run: node --test cloudflare-v2/scripts/test-booking-mail.mjs
      - name: Test full booking life cycle without actual email delivery
        run: node --test cloudflare-v2/scripts/test-booking-e2e.mjs
      - name: Test manual intake through protected admin only
        run: node --test cloudflare-v2/scripts/test-manual-booking.mjs
      - name: Test availability privacy and J-2 notifications
        run: node --test cloudflare-v2/scripts/test-calendar-availability.mjs
      - name: Check notification and availability modules
        run: node --input-type=module --check < cloudflare-v2/src/booking-notifications.js && node --input-type=module --check < cloudflare-v2/src/booking-availability.js
      - name: Test scheduling and private services
        run: node scripts/test-booking.mjs
      - name: Test Discord slash commands and signatures
        run: node --test discord-bot/scripts/test-bot.mjs
      - name: Test paid-only Discord room access and automatic revocation
        run: node --test discord-bot/scripts/test-room-automation.mjs
      - name: Check Discord access module syntax
        run: node --input-type=module --check < discord-bot/src/room-automation.js
      - name: Check protected Discord administration
        run: node --input-type=module --check < cloudflare-v2/src/discord-link-admin.js
      - name: Check Discord Worker syntax
        run: node --input-type=module --check < discord-bot/src/index.js
      - name: Check Discord registration script syntax
        run: node --check discord-bot/scripts/register-commands.mjs
      - name: Check shared site scripts
        run: node --check services.js && node --check calendrier.js
      - name: Test no-mail-app booking fallback and public discovery
        run: node scripts/test-mail-fallback.mjs
      - name: Check legal drafts, withdrawal script and real-payment safety gates
        run: node scripts/test-legal-payment-readiness.mjs
      - name: Check JS, internal links and price consistency
        run: node scripts/check-site.mjs
