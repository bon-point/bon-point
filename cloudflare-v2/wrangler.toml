name = "bon-point-v2"
main = "src/index.js"
compatibility_date = "2026-10-11"
workers_dev = true

[vars]
PAYMENTS_ENABLED = "false"
STRIPE_MODE = "test"
SITE_INTAKE_ENABLED = "false"
PARENT_PORTAL_ENABLED = "true"
ADMIN_PANEL_ENABLED = "true"
REPORT_UPLOADS_ENABLED = "true"
PARENT_SELF_SERVICE_CODES = "false"
REQUIRE_CONFIRMED_BOOKING = "true"
DISCORD_BOOKING_LINKS_ENABLED = "false"

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "bon-point-v2"
database_id = "fe8c895c-f678-4681-825b-3718e4e9cd66"
migrations_dir = "migrations"
