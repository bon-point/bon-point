name = "bon-point-v2"
main = "src/index.js"
compatibility_date = "2026-10-11"
workers_dev = true

[vars]
PAYMENTS_ENABLED = "false"
STRIPE_MODE = "test"

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "bon-point-v2"
database_id = "REMPLACER_APRES_CREATION_D1"
migrations_dir = "migrations"
