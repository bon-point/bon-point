name: Bon Point static checks
on:
  pull_request:
  push:
    branches:
      - main
      - refonte-premium-lancement-2026
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Worker module syntax
        run: node --input-type=module --check < cloudflare-v2/src/index.js
      - name: Check new private services Worker syntax
        run: node --input-type=module --check < cloudflare-v2/src/site-services.js
      - name: Check shared site scripts
        run: node --check services.js
      - name: Check JS, internal links and price consistency
        run: node scripts/check-site.mjs
