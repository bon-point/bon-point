name: Bon Point static checks
on:
  pull_request:
  push:
    branches:
      - main
      - refonte-premium-lancement-2026
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Worker module syntax
        run: node --input-type=module --check < cloudflare-v2/src/index.js
      - name: Check new private services Worker syntax
        run: node --input-type=module --check < cloudflare-v2/src/site-services.js
      - name: Check calendar and administration Worker syntax
        run: node --input-type=module --check < cloudflare-v2/src/operations.js
      - name: Test scheduling and private services
        run: node scripts/test-booking.mjs
      - name: Test Discord slash commands and signatures
        run: node --test discord-bot/scripts/test-bot.mjs
      - name: Check Discord Worker syntax
        run: node --input-type=module --check < discord-bot/src/index.js
      - name: Check Discord registration script syntax
        run: node --check discord-bot/scripts/register-commands.mjs
      - name: Check shared site scripts
        run: node --check services.js && node --check calendrier.js
      - name: Check JS, internal links and price consistency
        run: node scripts/check-site.mjs
